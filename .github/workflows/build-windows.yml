name: Build Windows companion

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "Companion/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Companion/requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r Companion/requirements.txt
          pip install pyinstaller
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name WoWStoryVoice --collect-all kokoro_onnx Companion/companion.py
      - name: Package addon
        shell: pwsh
        run: |
          Compress-Archive -Path WoWStoryVoice -DestinationPath dist/WoWStoryVoice-Addon.zip
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: WoWStoryVoice-Windows
          path: |
            dist/WoWStoryVoice.exe
            dist/WoWStoryVoice-Addon.zip
          if-no-files-found: error
