name: Build Windows companion

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "Companion/**"
      - "WoWStoryVoice/**"
      - "installer/**"
      - "release.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: wow-story-voice-windows-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Companion/requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Chatterbox 0.1.7 pins torch 2.6.0. Install the official CUDA 12.4
          # wheels explicitly so the packaged companion can use NVIDIA GPUs.
          pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cu124
          pip install -r Companion/requirements.txt
          pip install espeakng-loader phonemizer
          pip install pyinstaller
          python -c "import torch; print('torch', torch.__version__, 'cuda build', torch.version.cuda); from chatterbox.tts_turbo import ChatterboxTurboTTS; print('Chatterbox Turbo import OK')"
      - name: Run regression and package tests
        shell: pwsh
        run: |
          python Companion/test_protocol.py
          python Companion/test_app.py
          python Companion/test_emotion.py
          python Companion/test_beta.py
          python Companion/test_speaker_performance.py
          python Companion/test_speaker_indicator.py
          python Companion/test_latency.py
          python Companion/test_chatterbox.py
          python Companion/test_multi_engine.py
          python -m py_compile Companion/companion.py Companion/runtime.py Companion/app.py Companion/voice_profiles.py Companion/emotion_profiles.py Companion/beta_hardening.py Companion/speaker_performance.py Companion/chatterbox_backend.py Companion/chatterbox_patch.py Companion/kokoro_backend.py Companion/cosyvoice_backend.py Companion/tts_registry.py Companion/multi_engine.py Companion/voice_reference.py
      - name: Locate espeak-ng data
        id: espeak
        shell: pwsh
        run: |
          $pkg = python -c "import espeakng_loader, pathlib; print(pathlib.Path(espeakng_loader.__file__).parent)"
          Write-Host "espeakng_loader package: $pkg"
          Get-ChildItem -Recurse $pkg | Select-Object FullName
      - name: Build GUI companion folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name WoWStoryVoice --hidden-import chatterbox.tts_turbo --collect-all chatterbox --collect-all perth --collect-all s3tokenizer --collect-all conformer --collect-all espeakng_loader --collect-all pystray Companion/app.py
      - name: Package addon
        shell: pwsh
        run: |
          Compress-Archive -Path WoWStoryVoice -DestinationPath dist/WoWStoryVoice-Addon.zip
          Copy-Item dist/WoWStoryVoice-Addon.zip dist/WoWStoryVoice/WoWStoryVoice-Addon.zip
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc installer/WoWStoryVoice.iss
      - name: Create checksums
        shell: pwsh
        run: |
          $exe = Get-FileHash dist/WoWStoryVoice/WoWStoryVoice.exe -Algorithm SHA256
          $setup = Get-FileHash dist/WoWStoryVoice-Setup-v0.8.0.exe -Algorithm SHA256
          "$($exe.Hash)  WoWStoryVoice/WoWStoryVoice.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          "$($setup.Hash)  WoWStoryVoice-Setup-v0.8.0.exe" | Out-File -Encoding ascii -Append dist/SHA256SUMS.txt
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: WoWStoryVoice-Windows
          path: |
            dist/WoWStoryVoice/**
            dist/WoWStoryVoice-Addon.zip
            dist/WoWStoryVoice-Setup-v0.8.0.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
